<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BudgetIQ - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="bg-orbs">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
</div>

<div class="header">
    <h1>BudgetIQ</h1>
    <h2 id="userInfo"></h2>
</div>

<div class="container">
    <div class="dashboard-grid">
        
        <div class="card">
            <h2>Financial Insights & History</h2>
            <ul id="output">
                <li>Loading...</li>
            </ul>
        </div>

        <div class="card">
            <h2>Spending Overview</h2>
            <div class="chart-container">
                <canvas id="spendingChart"></canvas>
            </div>
        </div>

    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="insights.js"></script>

</body>
</html>
